<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAWHUB</title>
    <link rel="icon" type="image/png" href="rAw_white_logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #0d0d0d;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            overflow: hidden;
        }

        img {
            max-width: 300px;
            width: 80%;
            height: auto;
        }

        h1 {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 0.8;
            text-align: center;
        }
    </style>
</head>
<body>
    <img src="rAw_white.png" alt="RAW Logo">

</html>
